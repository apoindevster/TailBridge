[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tailbridge"
version = "0.1.0"
description = "Touchscreen Wi-Fi appliance and secure ts-redir integration for Raspberry Pi"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}

[tool.setuptools]
packages = ["tailbridge"]
